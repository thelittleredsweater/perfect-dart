name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Restore zsign executable bit
        run: chmod +x node_modules/nitron/vendor/zsign/linux/zsign

      - name: Build iOS IPA (ad-hoc signed)
        run: npx nitron build --target ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfect-darts-ios-ipa
          path: dist/app.ipa
          if-no-files-found: error
